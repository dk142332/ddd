<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 반응형을 위한 뷰포트 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 대기오염 정보</title>
  <!-- 외부 CSS 파일 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 전체 컨테이너 -->
  <div class="container">

    <!-- 헤더 영역 -->
    <header class="header">
      <h1 class="header__title">🌫️ 실시간 대기오염 정보</h1>
      <p class="header__subtitle">한국환경공단 에어코리아 데이터 기반</p>
    </header>

    <!-- 시도 선택 드롭다운 -->
    <div class="select-wrap">
      <label for="sido-select" class="select-wrap__label">시도 선택</label>
      <select id="sido-select" class="select-wrap__dropdown">
        <option value="">— 시도를 선택하세요 —</option>
        <option value="전국">전국</option>
        <option value="서울">서울</option>
        <option value="부산">부산</option>
        <option value="대구">대구</option>
        <option value="인천">인천</option>
        <option value="광주">광주</option>
        <option value="대전">대전</option>
        <option value="울산">울산</option>
        <option value="세종">세종</option>
        <option value="경기">경기</option>
        <option value="강원">강원</option>
        <option value="충북">충북</option>
        <option value="충남">충남</option>
        <option value="전북">전북</option>
        <option value="전남">전남</option>
        <option value="경북">경북</option>
        <option value="경남">경남</option>
        <option value="제주">제주</option>
      </select>
    </div>

    <!-- 평균 미세먼지 수치 표시 영역 -->
    <div id="average-section" class="average-section hidden">
      <p class="average-section__label">지역 평균 미세먼지 (PM10)</p>
      <p id="average-value" class="average-section__value">—</p>
      <p id="average-unit" class="average-section__unit">㎍/㎥</p>
    </div>

    <!-- 로딩 표시 -->
    <div id="loading" class="loading hidden">
      <div class="loading__spinner"></div>
      <p class="loading__text">데이터를 불러오는 중...</p>
    </div>

    <!-- 에러 메시지 표시 -->
    <div id="error-message" class="error-message hidden"></div>

    <!-- 측정소 카드 목록 -->
    <div id="card-grid" class="card-grid"></div>

  </div>

  <!-- 외부 자바스크립트 파일 연결 -->
  <script src="app.js"></script>
</body>
</html>
